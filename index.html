<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rewatchables</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="auth-bar">
    <div id="auth-signed-out">
      <span class="auth-prompt">Sign in to track what you've watched & listened to</span>
      <button id="sign-in-btn" onclick="signIn()">Sign in with Google</button>
    </div>
    <div id="auth-signed-in" style="display:none">
      <img id="user-avatar" src="" alt="">
      <span id="user-name"></span>
      <div id="track-filter-group">
        <button class="track-filter-btn" data-filter="watched" onclick="toggleTrackFilter('watched')">🎬 Watched</button>
        <button class="track-filter-btn" data-filter="unwatched" onclick="toggleTrackFilter('unwatched')">🎬 Unwatched</button>
        <button class="track-filter-btn" data-filter="listened" onclick="toggleTrackFilter('listened')">🎧 Listened</button>
        <button class="track-filter-btn" data-filter="unlistened" onclick="toggleTrackFilter('unlistened')">🎧 Unlistened</button>
      </div>
      <div id="track-stats">
        <span id="stat-watched" class="track-stat">🎬 <span id="stat-watched-count">0</span> of <span id="stat-watched-total">0</span> watched</span>
        <span class="track-stat-divider">·</span>
        <span id="stat-listened" class="track-stat">🎧 <span id="stat-listened-count">0</span> of <span id="stat-listened-total">0</span> listened</span>
      </div>
      <button id="sign-out-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div id="page-header">
    <div>
      <h1>The Rewatchables</h1>
      <p>Find where to watch every movie from the podcast.</p>
    </div>
    <a href="leaderboard.html" class="leaderboard-btn">🏆 Leaderboard</a>
  </div>

  <div id="top-bar">
    <span class="sort-label">Sort:</span>
    <div class="sort-group">
      <button class="sort-btn active" data-field="episode_date" onclick="setSort('episode_date')">
        Episode Date <span class="sort-arrow">↑</span>
      </button>
      <button class="sort-btn" data-field="imdb_rating" onclick="setSort('imdb_rating')">
        IMDb <span class="sort-arrow"></span>
      </button>
      <button class="sort-btn" data-field="rt_audience_score" onclick="setSort('rt_audience_score')">
        RT Score <span class="sort-arrow"></span>
      </button>
      <button class="sort-btn" data-field="runtime" onclick="setSort('runtime')">
        Runtime <span class="sort-arrow"></span>
      </button>
    </div>
  </div>

  <div id="search-bar">
    <div class="search-field">
      <label class="search-label">Title</label>
      <div class="input-wrap">
        <input type="text" id="search-title" placeholder="e.g. Heat">
        <button class="input-clear" onclick="clearField('search-title')" tabindex="-1">✕</button>
      </div>
    </div>
    <div class="search-field">
      <label class="search-label">Director</label>
      <div class="input-wrap">
        <input type="text" id="search-director" placeholder="e.g. Scorsese">
        <button class="input-clear" onclick="clearField('search-director')" tabindex="-1">✕</button>
      </div>
    </div>
    <div class="search-field">
      <label class="search-label">Cast</label>
      <div class="input-wrap">
        <input type="text" id="search-cast" placeholder="e.g. Al Pacino">
        <button class="input-clear" onclick="clearField('search-cast')" tabindex="-1">✕</button>
      </div>
    </div>
    <div class="search-field">
      <label class="search-label">Host</label>
      <div class="input-wrap">
        <input type="text" id="search-host" placeholder="e.g. Van Lathan">
        <button class="input-clear" onclick="clearField('search-host')" tabindex="-1">✕</button>
      </div>
    </div>
    <button id="clear-btn" onclick="clearSearch()">Clear All</button>
  </div>

  <div id="service-bar">
    <span class="service-label">Stream on:</span>
    <button class="service-btn" onclick="filterByService('Netflix')">Netflix</button>
    <button class="service-btn" onclick="filterByService('Max')">Max</button>
    <button class="service-btn" onclick="filterByService('Hulu')">Hulu</button>
    <button class="service-btn" onclick="filterByService('Prime Video')">Prime Video</button>
    <button class="service-btn" onclick="filterByService('Peacock')">Peacock</button>
    <button class="service-btn" onclick="filterByService('AppleTV+')">Apple TV+</button>
    <button class="service-btn" onclick="filterByService('Disney+')">Disney+</button>
    <button class="service-btn" onclick="filterByService('Tubi TV')">Tubi TV</button>
    <button class="service-btn" onclick="filterByService('Pluto TV')">Pluto TV</button>
    <button class="service-btn free-btn" onclick="filterByService('free')">Free</button>
  </div>

  <div id="result-count"></div>
  <div id="movie-list"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC-c9N0fzTQUk6twvtlmI574FHVncyv3qs",
      authDomain: "rewatchables-917ea.firebaseapp.com",
      projectId: "rewatchables-917ea",
      storageBucket: "rewatchables-917ea.firebasestorage.app",
      messagingSenderId: "1036089561697",
      appId: "1:1036089561697:web:4a08136120a731323e9020"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    // tracking: { [movieId]: { watched: bool, listened: bool } }
    let tracking = {};

    // Expose to global scope for onclick handlers
    window.signIn = async () => {
      try { await signInWithPopup(auth, provider); }
      catch (e) { console.error('Sign-in error', e); }
    };



    window.signOut = async () => {
      await fbSignOut(auth);
      tracking = {};
      currentUser = null;
      document.getElementById('auth-signed-out').style.display = '';
      document.getElementById('auth-signed-in').style.display = 'none';
      window.filterMovies();
    };

    // Load tracking data from Firestore
    async function loadTracking(uid) {
      try {
        const ref = doc(db, 'users', uid, 'data', 'tracking');
        const snap = await getDoc(ref);
        tracking = snap.exists() ? (snap.data().items || {}) : {};
      } catch (e) {
        console.error('Load tracking error', e);
        tracking = {};
      }
      window.tracking = tracking;
      if (window.updateTrackStats) window.updateTrackStats();
      window.filterMovies();
    }

    // Save tracking data to Firestore (debounced)
    let saveTimer = null;
    async function saveTracking(uid) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          const ref = doc(db, 'users', uid, 'data', 'tracking');
          await setDoc(ref, { items: tracking });
        } catch (e) { console.error('Save error', e); }
      }, 800);
    }

    // Toggle watched/listened for a movie
    window.toggleTrack = async (movieId, field) => {
      if (!currentUser) return;
      const key = String(movieId);
      if (!tracking[key]) tracking[key] = { watched: false, listened: false };
      tracking[key][field] = !tracking[key][field];
      const newVal = tracking[key][field];

      // If toggling watched, sync all episodes of the same movie
      if (field === 'watched') {
        const movie = window.allMovies.find(m => m.id === movieId);
        if (movie) {
          const siblings = window.allMovies.filter(m =>
            m.movie_title === movie.movie_title && m.movie_year === movie.movie_year
          );
          siblings.forEach(m => {
            const k = String(m.id);
            if (!tracking[k]) tracking[k] = { watched: false, listened: false };
            tracking[k].watched = newVal;
            // Update sibling card buttons in the DOM
            const sibBtn = document.querySelector(`#card-${m.id} .track-btn[data-field="watched"]`);
            if (sibBtn) {
              sibBtn.classList.toggle('active', newVal);
              sibBtn.textContent = newVal ? '🎬 Watched' : '🎬 Watched?';
            }
            const sibCard = document.getElementById(`card-${m.id}`);
            if (sibCard) sibCard.classList.toggle('card-watched', newVal);
          });
        }
      } else {
        // Update just this card's button
        const btn = document.querySelector(`#card-${movieId} .track-btn[data-field="${field}"]`);
        if (btn) {
          btn.classList.toggle('active', newVal);
          btn.textContent = newVal ? '🎧 Listened' : '🎧 Listened?';
        }
        const card = document.getElementById(`card-${movieId}`);
        if (card) card.classList.toggle('card-listened', newVal);
      }

      window.tracking = tracking;
      updateTrackStats();

      // Re-filter if a track filter is active
      if (window.activeTrackFilter) window.filterMovies();

      await saveTracking(currentUser.uid);
    };

    // Compute and display watched/listened counts
    window.updateTrackStats = function() {
      if (!window.allMovies || !window.allMovies.length) return;

      // Unique movies: dedupe by title+year
      const uniqueMovies = [];
      const seen = new Set();
      window.allMovies.forEach(m => {
        const k = m.movie_title + '_' + m.movie_year;
        if (!seen.has(k)) { seen.add(k); uniqueMovies.push(m); }
      });

      // Count watched unique movies (any episode of movie marked watched)
      const watchedCount = uniqueMovies.filter(m => {
        const episodes = window.allMovies.filter(e =>
          e.movie_title === m.movie_title && e.movie_year === m.movie_year
        );
        return episodes.some(e => (window.tracking[String(e.id)] || {}).watched);
      }).length;

      // Count listened episodes
      const listenedCount = window.allMovies.filter(m =>
        (window.tracking[String(m.id)] || {}).listened
      ).length;

      const totalUnique = uniqueMovies.length;
      const totalEpisodes = window.allMovies.length;

      const wc = document.getElementById('stat-watched-count');
      const wt = document.getElementById('stat-watched-total');
      const lc = document.getElementById('stat-listened-count');
      const lt = document.getElementById('stat-listened-total');
      if (wc) wc.textContent = watchedCount;
      if (wt) wt.textContent = totalUnique;
      if (lc) lc.textContent = listenedCount;
      if (lt) lt.textContent = totalEpisodes;
    };

    window._currentUser = () => currentUser;

    // Wait for DOM and main script to be ready before handling auth state
    function onReady(fn) {
      if (document.readyState === 'complete') { fn(); }
      else { window.addEventListener('load', fn); }
    }

    onAuthStateChanged(auth, async user => {
      onReady(async () => {
        if (user) {
          currentUser = user;
          document.getElementById('auth-signed-out').style.display = 'none';
          document.getElementById('auth-signed-in').style.display = '';
          document.getElementById('user-name').textContent = user.displayName || user.email;
          const avatar = document.getElementById('user-avatar');
          if (user.photoURL) { avatar.src = user.photoURL; avatar.style.display = ''; }
          else { avatar.style.display = 'none'; }
          // Ensure user document exists in the users collection
        await setDoc(doc(db, 'users', user.uid), {
          displayName: user.displayName || '',
          email: user.email || '',
          lastSeen: serverTimestamp()
        }, { merge: true });
        await loadTracking(user.uid);
        } else {
          currentUser = null;
          document.getElementById('auth-signed-out').style.display = '';
          document.getElementById('auth-signed-in').style.display = 'none';
          if (window.filterMovies) window.filterMovies();
        }
      });
    });
  </script>

  <script>
    let allMovies = [];
    let streamingData = {};
    let sortField = 'episode_date';
    let sortAsc = true;
    let activeService = null;
    window.activeTrackFilter = null;
    window.tracking = {};

    Promise.all([
      fetch('rewatchables.json').then(r => r.json()),
      fetch('streaming_data.json').then(r => r.json()).catch(() => ({ movies: {} }))
    ]).then(([movies, streaming]) => {
      allMovies = movies;
      window.allMovies = movies;
      streamingData = streaming.movies || {};
      if (window.updateTrackStats) window.updateTrackStats();
      displayMovies(sortMovies(allMovies));
    });

    function parseRating(val) {
      if (val == null || val === '') return -Infinity;
      const n = parseFloat(String(val).replace('%', ''));
      return isNaN(n) ? -Infinity : n;
    }

    function parseRuntime(str) {
      if (!str) return -Infinity;
      const h = str.match(/(\d+)h/);
      const m = str.match(/(\d+)m/);
      return (h ? parseInt(h[1]) * 60 : 0) + (m ? parseInt(m[1]) : 0) || -Infinity;
    }

    function sortMovies(movies) {
      return [...movies].sort((a, b) => {
        let av, bv;
        if (sortField === 'episode_date') {
          av = a.episode_date || '';
          bv = b.episode_date || '';
          return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
        } else if (sortField === 'runtime') {
          av = parseRuntime(a.runtime);
          bv = parseRuntime(b.runtime);
          if (av === -Infinity && bv === -Infinity) return 0;
          if (av === -Infinity) return 1;
          if (bv === -Infinity) return -1;
          return sortAsc ? av - bv : bv - av;
        } else {
          av = parseRating(a[sortField]);
          bv = parseRating(b[sortField]);
          if (av === -Infinity && bv === -Infinity) return 0;
          if (av === -Infinity) return 1;
          if (bv === -Infinity) return -1;
          return sortAsc ? av - bv : bv - av;
        }
      });
    }

    function setSort(field) {
      if (sortField === field) {
        sortAsc = !sortAsc;
      } else {
        sortField = field;
        sortAsc = (field === 'episode_date');
      }
      document.querySelectorAll('.sort-btn').forEach(btn => {
        const isActive = btn.dataset.field === sortField;
        btn.classList.toggle('active', isActive);
        btn.querySelector('.sort-arrow').textContent = isActive ? (sortAsc ? '↑' : '↓') : '';
      });
      filterMovies();
    }

    function getStreamingKey(movie) {
      return `${movie.movie_title}_${movie.movie_year}`;
    }

    function getMovieSources(movie) {
      return (streamingData[getStreamingKey(movie)] || {}).sources || [];
    }

    function filterByService(service) {
      if (activeService === service) {
        activeService = null;
        document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
      } else {
        activeService = service;
        document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
      }
      filterMovies();
    }

    function toggleTrackFilter(filter) {
      if (window.activeTrackFilter === filter) {
        window.activeTrackFilter = null;
        document.querySelectorAll('.track-filter-btn').forEach(b => b.classList.remove('active'));
      } else {
        window.activeTrackFilter = filter;
        document.querySelectorAll('.track-filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.track-filter-btn[data-filter="${filter}"]`).classList.add('active');
      }
      filterMovies();
    }

    function movieMatchesTrackFilter(movie) {
      if (!window.activeTrackFilter) return true;
      const t = (window.tracking[String(movie.id)] || {});
      if (window.activeTrackFilter === 'watched')   return !!t.watched;
      if (window.activeTrackFilter === 'unwatched')  return !t.watched;
      if (window.activeTrackFilter === 'listened')  return !!t.listened;
      if (window.activeTrackFilter === 'unlistened') return !t.listened;
      return true;
    }

    function movieMatchesService(movie) {
      if (!activeService) return true;
      const sources = getMovieSources(movie);
      if (activeService === 'free') return sources.some(s => s.type === 'free');
      const freeOrSub = sources.filter(s => s.type === 'free' || s.type === 'sub' || s.type === 'subscription');
      if (activeService === 'AppleTV+') return freeOrSub.some(s => s.service.toLowerCase().includes('appletv'));
      return freeOrSub.some(s => s.service.toLowerCase() === activeService.toLowerCase());
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    const SOURCE_PREVIEW = 4;

    function formatSources(sources, movieId) {
      if (!sources || sources.length === 0) {
        return '<p class="no-sources">Not currently streaming.</p>';
      }
      const labels = {
        'free':         { text: 'Free',         color: '#4caf50' },
        'sub':          { text: 'Subscription', color: '#2196f3' },
        'subscription': { text: 'Subscription', color: '#2196f3' },
        'tve':          { text: 'Cable',        color: '#9c27b0' },
        'rent':         { text: 'Rent',         color: '#ff9800' },
        'buy':          { text: 'Buy',          color: '#9e9e9e' }
      };

      function renderSource(source) {
        const label = labels[source.type] || { text: source.type, color: '#888' };
        const price = source.price ? ` · $${source.price}` : '';
        const link = source.url ? `href="${source.url}" target="_blank"` : '';
        return `
          <div class="source-item">
            <span class="source-type" style="color: ${label.color}">${label.text}${price}</span>
            <a class="source-name" ${link}>${source.service}</a>
          </div>`;
      }

      const preview = sources.slice(0, SOURCE_PREVIEW).map(renderSource).join('');
      const extra = sources.slice(SOURCE_PREVIEW);
      if (extra.length === 0) return preview;
      const extraHtml = extra.map(renderSource).join('');
      const uid = `src-extra-${movieId}`;
      return `
        ${preview}
        <div id="${uid}" style="display:none">${extraHtml}</div>
        <button class="sources-toggle-btn" onclick="toggleSources('${uid}', this)">+ ${extra.length} more</button>
      `;
    }

    function toggleSources(uid, btn) {
      const el = document.getElementById(uid);
      const isHidden = el.style.display === 'none';
      el.style.display = isHidden ? 'block' : 'none';
      btn.textContent = isHidden ? '− show less' : `+ ${el.querySelectorAll('.source-item').length} more`;
    }

    function renderTrackButtons(movieId) {
      const user = window._currentUser ? window._currentUser() : null;
      if (!user) return '';
      const t = window.tracking[String(movieId)] || {};
      return `
        <div class="track-row">
          <button class="track-btn ${t.watched ? 'active' : ''}" data-field="watched"
            onclick="toggleTrack(${movieId}, 'watched')"
            title="${t.watched ? 'Watched ✓' : 'Mark as watched'}">
            🎬 ${t.watched ? 'Watched' : 'Watched?'}
          </button>
          <button class="track-btn ${t.listened ? 'active' : ''}" data-field="listened"
            onclick="toggleTrack(${movieId}, 'listened')"
            title="${t.listened ? 'Listened ✓' : 'Mark as listened'}">
            🎧 ${t.listened ? 'Listened' : 'Listened?'}
          </button>
        </div>`;
    }

    function displayMovies(movies) {
      const container = document.getElementById('movie-list');
      container.innerHTML = '';

      const countEl = document.getElementById('result-count');
      countEl.textContent = movies.length === allMovies.length
        ? `${allMovies.length} episodes`
        : `${movies.length} of ${allMovies.length} episodes`;

      if (movies.length === 0) {
        container.innerHTML = '<p class="no-results">No movies found.</p>';
        return;
      }

      movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.id = `card-${movie.id}`;

        const t = window.tracking[String(movie.id)] || {};
        if (t.watched) card.classList.add('card-watched');
        if (t.listened) card.classList.add('card-listened');

        const genres = (movie.genre || []).map(g =>
          `<span class="genre-tag">${g}</span>`
        ).join('');

        const rewatchBadge = movie.is_rewatch
          ? `<span class="rewatch-badge">${movie.episode_label || 'Re-watch'}</span>`
          : (movie.episode_label ? `<span class="rewatch-badge">${movie.episode_label}</span>` : '');

        const ratings = [];
        if (movie.imdb_rating) ratings.push(`<span class="rating imdb">IMDb ${movie.imdb_rating}</span>`);
        if (movie.rt_audience_score) ratings.push(`<span class="rating rt">RT ${movie.rt_audience_score}</span>`);

        const castList = (movie.cast || []).length > 0
          ? `<div class="movie-cast">${movie.cast.join(' · ')}</div>`
          : '';

        const sources = getMovieSources(movie);
        const streamingHtml = sources.length > 0
          ? `<div class="streaming-info">${formatSources(sources, movie.id)}</div>`
          : `<div class="streaming-info"><p class="no-sources">Not currently streaming.</p></div>`;

        card.innerHTML = `
          <div class="card-top-row">
            <div class="movie-title">${movie.movie_title}${rewatchBadge}</div>
          </div>
          <div class="movie-year">${movie.movie_year} · ${movie.director}${movie.runtime ? ' · ' + movie.runtime : ''}</div>
          ${genres ? `<div class="genre-row">${genres}</div>` : ''}
          ${ratings.length ? `<div class="ratings-row">${ratings.join('')}</div>` : ''}
          ${castList}
          <div class="movie-meta">
            ${movie.episode_date ? `<span>${formatDate(movie.episode_date)}</span>` : ''}
          </div>
          ${movie.hosts && movie.hosts.length > 0 ? `<div class="movie-hosts">Hosts: ${movie.hosts.join(', ')}</div>` : ''}
          ${streamingHtml}
          ${renderTrackButtons(movie.id)}
        `;
        container.appendChild(card);
      });
    }

    window.filterMovies = function filterMovies() {
      const title    = document.getElementById('search-title').value.toLowerCase().trim();
      const director = document.getElementById('search-director').value.toLowerCase().trim();
      const cast     = document.getElementById('search-cast').value.toLowerCase().trim();
      const host     = document.getElementById('search-host').value.toLowerCase().trim();

      const filtered = allMovies.filter(movie => {
        if (title    && !movie.movie_title.toLowerCase().includes(title))                  return false;
        if (director && !movie.director.toLowerCase().includes(director))                  return false;
        if (cast     && !(movie.cast || []).some(c => c.toLowerCase().includes(cast)))     return false;
        if (host     && !(movie.hosts || []).some(h => h.toLowerCase().includes(host)))    return false;
        if (!movieMatchesService(movie))                                                   return false;
        if (!movieMatchesTrackFilter(movie))                                               return false;
        return true;
      });

      displayMovies(sortMovies(filtered));
    }

    function clearSearch() {
      ['search-title', 'search-director', 'search-cast', 'search-host'].forEach(id => {
        const input = document.getElementById(id);
        input.value = '';
        input.nextElementSibling.classList.remove('visible');
      });
      activeService = null;
      window.activeTrackFilter = null;
      document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.track-filter-btn').forEach(b => b.classList.remove('active'));
      displayMovies(sortMovies(allMovies));
    }

    function clearField(id) {
      const input = document.getElementById(id);
      input.value = '';
      input.nextElementSibling.classList.remove('visible');
      filterMovies();
      input.focus();
    }

    ['search-title', 'search-director', 'search-cast', 'search-host'].forEach(id => {
      const input = document.getElementById(id);
      input.addEventListener('input', () => {
        input.nextElementSibling.classList.toggle('visible', input.value.length > 0);
        filterMovies();
      });
    });
  </script>

  <footer id="attribution">
    Streaming data powered by <a href="https://www.watchmode.com/" target="_blank">Watchmode.com</a>
  </footer>

</body>
</html>
