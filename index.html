<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rewatchables</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>The Rewatchables</h1>
  <p>Find where to watch every movie from the podcast.</p>

  <div id="top-bar">
    <span class="sort-label">Sort:</span>
    <div class="sort-group">
      <button class="sort-btn active" data-field="episode_date" onclick="setSort('episode_date')">
        Episode Date <span class="sort-arrow">↑</span>
      </button>
      <button class="sort-btn" data-field="imdb_rating" onclick="setSort('imdb_rating')">
        IMDb <span class="sort-arrow"></span>
      </button>
      <button class="sort-btn" data-field="rt_audience_score" onclick="setSort('rt_audience_score')">
        RT Score <span class="sort-arrow"></span>
      </button>
    </div>
  </div>

  <div id="search-bar">
    <div class="search-field">
      <label class="search-label">Title</label>
      <input type="text" id="search-title" placeholder="e.g. Heat">
    </div>
    <div class="search-field">
      <label class="search-label">Director</label>
      <input type="text" id="search-director" placeholder="e.g. Scorsese">
    </div>
    <div class="search-field">
      <label class="search-label">Cast</label>
      <input type="text" id="search-cast" placeholder="e.g. Al Pacino">
    </div>
    <div class="search-field">
      <label class="search-label">Host</label>
      <input type="text" id="search-host" placeholder="e.g. Van Lathan">
    </div>
    <button id="clear-btn" onclick="clearSearch()">Clear</button>
  </div>

  <div id="service-bar">
    <span class="service-label">Stream on:</span>
    <button class="service-btn" onclick="filterByService('Netflix')">Netflix</button>
    <button class="service-btn" onclick="filterByService('Max')">Max</button>
    <button class="service-btn" onclick="filterByService('Hulu')">Hulu</button>
    <button class="service-btn" onclick="filterByService('Prime Video')">Prime Video</button>
    <button class="service-btn" onclick="filterByService('Peacock')">Peacock</button>
    <button class="service-btn" onclick="filterByService('AppleTV+')">Apple TV+</button>
    <button class="service-btn" onclick="filterByService('Disney+')">Disney+</button>
    <button class="service-btn" onclick="filterByService('Tubi TV')">Tubi TV</button>
    <button class="service-btn" onclick="filterByService('Pluto TV')">Pluto TV</button>
    <button class="service-btn free-btn" onclick="filterByService('free')">Free</button>
  </div>

  <div id="result-count"></div>
  <div id="movie-list"></div>

  <script src="streaming.js"></script>
  <script>
    let allMovies = [];
    let streamingData = {};
    let sortField = 'episode_date';
    let sortAsc = true;
    let activeService = null;

    // Load both data files
    Promise.all([
      fetch('rewatchables.json').then(r => r.json()),
      fetch('streaming_data.json').then(r => r.json()).catch(() => ({ movies: {} }))
    ]).then(([movies, streaming]) => {
      allMovies = movies;
      streamingData = streaming.movies || {};
      displayMovies(sortMovies(allMovies));
    });

    function parseRating(val) {
      if (val == null || val === '') return -Infinity;
      // RT scores come as "94%" strings; IMDb as numbers
      const n = parseFloat(String(val).replace('%', ''));
      return isNaN(n) ? -Infinity : n;
    }

    function sortMovies(movies) {
      return [...movies].sort((a, b) => {
        let av, bv;
        if (sortField === 'episode_date') {
          av = a.episode_date || '';
          bv = b.episode_date || '';
          return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
        } else {
          av = parseRating(a[sortField]);
          bv = parseRating(b[sortField]);
          // Always put missing ratings at the bottom regardless of direction
          if (av === -Infinity && bv === -Infinity) return 0;
          if (av === -Infinity) return 1;
          if (bv === -Infinity) return -1;
          return sortAsc ? av - bv : bv - av;
        }
      });
    }

    function setSort(field) {
      if (sortField === field) {
        // Same field — flip direction
        sortAsc = !sortAsc;
      } else {
        // New field — default: date asc, ratings desc
        sortField = field;
        sortAsc = (field === 'episode_date');
      }
      // Update button states
      document.querySelectorAll('.sort-btn').forEach(btn => {
        const isActive = btn.dataset.field === sortField;
        btn.classList.toggle('active', isActive);
        btn.querySelector('.sort-arrow').textContent = isActive ? (sortAsc ? '↑' : '↓') : '';
      });
      filterMovies();
    }

    function getStreamingKey(movie) {
      return `${movie.movie_title}_${movie.movie_year}`;
    }

    function getMovieSources(movie) {
      return (streamingData[getStreamingKey(movie)] || {}).sources || [];
    }

    function filterByService(service) {
      // Toggle off if already active
      if (activeService === service) {
        activeService = null;
        document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
      } else {
        activeService = service;
        document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
      }
      filterMovies();
    }

    function movieMatchesService(movie) {
      if (!activeService) return true;
      const sources = getMovieSources(movie);
      // Free button — match any free source
      if (activeService === 'free') {
        return sources.some(s => s.type === 'free');
      }
      // Service buttons — only match free or subscription, not rent/buy
      const freeOrSub = sources.filter(s => s.type === 'free' || s.type === 'sub' || s.type === 'subscription');
      if (activeService === 'AppleTV+') {
        return freeOrSub.some(s => s.service.toLowerCase().includes('appletv'));
      }
      return freeOrSub.some(s => s.service.toLowerCase() === activeService.toLowerCase());
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + 'T00:00:00');
      return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function formatSources(sources) {
      if (!sources || sources.length === 0) {
        return '<p class="no-sources">Not currently streaming.</p>';
      }
      const labels = {
        'free':         { text: 'Free',         color: '#4caf50' },
        'sub':          { text: 'Subscription', color: '#2196f3' },
        'subscription': { text: 'Subscription', color: '#2196f3' },
        'rent':         { text: 'Rent',         color: '#ff9800' },
        'buy':          { text: 'Buy',          color: '#9e9e9e' }
      };
      return sources.slice(0, 8).map(source => {
        const label = labels[source.type] || { text: source.type, color: '#888' };
        const price = source.price ? ` · $${source.price}` : '';
        const link = source.url ? `href="${source.url}" target="_blank"` : '';
        return `
          <div class="source-item">
            <span class="source-type" style="color: ${label.color}">${label.text}${price}</span>
            <a class="source-name" ${link}>${source.service}</a>
          </div>`;
      }).join('');
    }

    function displayMovies(movies) {
      const container = document.getElementById('movie-list');
      container.innerHTML = '';

      const countEl = document.getElementById('result-count');
      countEl.textContent = movies.length === allMovies.length
        ? `${allMovies.length} episodes`
        : `${movies.length} of ${allMovies.length} episodes`;

      if (movies.length === 0) {
        container.innerHTML = '<p class="no-results">No movies found.</p>';
        return;
      }

      movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.id = `card-${movie.id}`;

        const genres = (movie.genre || []).map(g =>
          `<span class="genre-tag">${g}</span>`
        ).join('');

        const rewatchBadge = movie.is_rewatch
          ? `<span class="rewatch-badge">${movie.episode_label || 'Re-watch'}</span>`
          : (movie.episode_label ? `<span class="rewatch-badge">${movie.episode_label}</span>` : '');

        const ratings = [];
        if (movie.imdb_rating) ratings.push(`<span class="rating imdb">IMDb ${movie.imdb_rating}</span>`);
        if (movie.rt_audience_score) ratings.push(`<span class="rating rt">RT ${movie.rt_audience_score}</span>`);

        const castList = (movie.cast || []).length > 0
          ? `<div class="movie-cast">${movie.cast.join(' · ')}</div>`
          : '';

        // Streaming — show inline from pre-loaded data
        const sources = getMovieSources(movie);
        const streamingHtml = sources.length > 0
          ? `<div class="streaming-info">${formatSources(sources)}</div>`
          : `<div class="streaming-info"><p class="no-sources">Not currently streaming.</p></div>`;

        card.innerHTML = `
          <div class="card-top-row">
            <div class="movie-title">${movie.movie_title}${rewatchBadge}</div>
          </div>
          <div class="movie-year">${movie.movie_year} · ${movie.director}${movie.runtime ? ' · ' + movie.runtime : ''}</div>
          ${genres ? `<div class="genre-row">${genres}</div>` : ''}
          ${ratings.length ? `<div class="ratings-row">${ratings.join('')}</div>` : ''}
          ${castList}
          <div class="movie-meta">
            ${movie.episode_date ? `<span>${formatDate(movie.episode_date)}</span>` : ''}
          </div>
          ${movie.hosts && movie.hosts.length > 0 ? `<div class="movie-hosts">Hosts: ${movie.hosts.join(', ')}</div>` : ''}
          ${streamingHtml}
        `;
        container.appendChild(card);
      });
    }

    function filterMovies() {
      const title    = document.getElementById('search-title').value.toLowerCase().trim();
      const director = document.getElementById('search-director').value.toLowerCase().trim();
      const cast     = document.getElementById('search-cast').value.toLowerCase().trim();
      const host     = document.getElementById('search-host').value.toLowerCase().trim();

      const filtered = allMovies.filter(movie => {
        if (title    && !movie.movie_title.toLowerCase().includes(title))                  return false;
        if (director && !movie.director.toLowerCase().includes(director))                  return false;
        if (cast     && !(movie.cast || []).some(c => c.toLowerCase().includes(cast)))     return false;
        if (host     && !(movie.hosts || []).some(h => h.toLowerCase().includes(host)))    return false;
        if (!movieMatchesService(movie))                                                   return false;
        return true;
      });

      displayMovies(sortMovies(filtered));
    }

    function clearSearch() {
      document.getElementById('search-title').value    = '';
      document.getElementById('search-director').value = '';
      document.getElementById('search-cast').value     = '';
      document.getElementById('search-host').value     = '';
      activeService = null;
      document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
      displayMovies(sortMovies(allMovies));
    }

    ['search-title', 'search-director', 'search-cast', 'search-host'].forEach(id => {
      document.getElementById(id).addEventListener('input', filterMovies);
    });
  </script>

  <footer id="attribution">
    Streaming data powered by <a href="https://www.watchmode.com/" target="_blank">Watchmode.com</a>
  </footer>

</body>
</html>
